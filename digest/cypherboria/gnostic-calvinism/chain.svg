<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" font-family="Helvetica,Arial,sans-serif"><rect width="100%" height="100%" fill="#f7f5ef"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto"><path d="M0,0 L10,0 L5,10 z" fill="#8b0000"/></marker></defs><text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold">The chain: one idea, "order without a planner," in six forms</text><rect x="110" y="50" width="540" height="48" rx="8" fill="#fff" stroke="#8b0000" stroke-width="2"/><text x="380" y="71" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Faith over works</text><text x="380" y="89" text-anchor="middle" font-size="12" fill="#555">Salvation is not earned by good deeds</text><line x1="380" y1="99" x2="380" y2="116" stroke="#8b0000" stroke-width="2.5" marker-end="url(#a)"/><rect x="110" y="120" width="540" height="48" rx="8" fill="#fff" stroke="#8b0000" stroke-width="2"/><text x="380" y="141" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Spontaneous order</text><text x="380" y="159" text-anchor="middle" font-size="12" fill="#555">Markets order themselves (Smith, Hayek)</text><line x1="380" y1="169" x2="380" y2="186" stroke="#8b0000" stroke-width="2.5" marker-end="url(#a)"/><rect x="110" y="190" width="540" height="48" rx="8" fill="#fff" stroke="#8b0000" stroke-width="2"/><text x="380" y="211" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Natural selection</text><text x="380" y="229" text-anchor="middle" font-size="12" fill="#555">Life designs itself (Darwin)</text><line x1="380" y1="239" x2="380" y2="256" stroke="#8b0000" stroke-width="2.5" marker-end="url(#a)"/><rect x="110" y="260" width="540" height="48" rx="8" fill="#fff" stroke="#8b0000" stroke-width="2"/><text x="380" y="281" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Far-from-equilibrium thermodynamics</text><text x="380" y="299" text-anchor="middle" font-size="12" fill="#555">Energy flows build structure</text><line x1="380" y1="309" x2="380" y2="326" stroke="#8b0000" stroke-width="2.5" marker-end="url(#a)"/><rect x="110" y="330" width="540" height="48" rx="8" fill="#fff" stroke="#8b0000" stroke-width="2"/><text x="380" y="351" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Neural-net deep learning</text><text x="380" y="369" text-anchor="middle" font-size="12" fill="#555">Machines learn without a planner</text><line x1="380" y1="379" x2="380" y2="396" stroke="#8b0000" stroke-width="2.5" marker-end="url(#a)"/><rect x="110" y="400" width="540" height="48" rx="8" fill="#8b0000" stroke="#8b0000" stroke-width="2"/><text x="380" y="421" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">Techonomic singularity</text><text x="380" y="439" text-anchor="middle" font-size="12" fill="#fff">Self-driving tech + economy</text><text x="380" y="495" text-anchor="middle" font-size="11" fill="#555">Diagram by the Desk. Chain as quoted by Valenčič (11 Apr 2026); plain glosses are the Desk's.</text></svg>